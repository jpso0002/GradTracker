<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Form components</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{padding:16px;background:var(--surface-page)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:var(--micro-cap-size);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div><script type="text/babel">const { Input, Select, Checkbox, Switch, SearchField } = window.GradTrackerDesignSystem_b026b0;
function Demo(){const[v,setV]=React.useState("Monzo");const[st,setSt]=React.useState("Interview scheduled");const[c,setC]=React.useState(true);const[s,setS]=React.useState(true);const[q,setQ]=React.useState("");
 return(<div className="col" style={{gap:18}}>
  <div className="row" style={{alignItems:"flex-start",gap:16}}>
    <Input label="Company" iconLeft="building-2" value={v} onChange={e=>setV(e.target.value)} style={{width:200}}/>
    <Select label="Stage" value={st} onChange={setSt} options={["Applied","Assessment pending","Interview scheduled","Offer received","Rejected","Withdrawn"]} style={{width:210}}/>
    <Input label="Deadline" numeric value="14 Sep 2026" hint="Tabular figures" style={{width:160}}/>
  </div>
  <div className="row" style={{alignItems:"flex-start",gap:16}}>
    <Input label="University email" error="We couldn't reach that address" value="ana@uni" style={{width:240}}/>
    <SearchField value={q} onChange={e=>setQ(e.target.value)} width={240}/>
  </div>
  <div className="row" style={{gap:32,alignItems:"flex-start"}}>
    <Checkbox checked={c} onChange={setC} label="Email me deadline reminders" description="One digest each morning, never more."/>
    <Switch checked={s} onChange={setS} label="Auto-detect applications" description="Reads new mail every 15 minutes." style={{width:280}}/>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);</script></body></html>
