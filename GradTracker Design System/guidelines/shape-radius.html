<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:4px"></div><span class="tk">xs · 4</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:6px"></div><span class="tk">sm · 6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:8px"></div><span class="tk">md · 8</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:12px"></div><span class="tk">lg · 12</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:16px"></div><span class="tk">xl · 16</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:9999px"></div><span class="tk">pill · 9999</span></div></div></body></html>
