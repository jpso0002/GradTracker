<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--ruby)"></div><div class="m"><span class="n">Ruby</span><span class="tk">--ruby</span></div></div><div class="sw"><div class="chip" style="background:var(--ruby-deep)"></div><div class="m"><span class="n">Ruby deep</span><span class="tk">--ruby-deep</span></div></div><div class="sw"><div class="chip" style="background:var(--magenta)"></div><div class="m"><span class="n">Magenta</span><span class="tk">--magenta</span></div></div><div class="sw"><div class="chip" style="background:var(--lemon)"></div><div class="m"><span class="n">Lemon</span><span class="tk">--lemon</span></div></div><div class="sw"><div class="chip" style="background:var(--jade)"></div><div class="m"><span class="n">Jade</span><span class="tk">--jade</span></div></div><div class="sw"><div class="chip" style="background:var(--shadow-blue)"></div><div class="m"><span class="n">Shadow blue</span><span class="tk">--shadow-blue</span></div></div></div></body></html>
