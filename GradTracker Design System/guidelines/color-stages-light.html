<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g" style="gap:8px"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-applied-bg);color:var(--stage-applied-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-applied-dot)"></span>Applied</span><span class="tk">--stage-applied-*</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-assessment-bg);color:var(--stage-assessment-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-assessment-dot)"></span>Assessment pending</span><span class="tk">--stage-assessment-*</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-interview-bg);color:var(--stage-interview-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-interview-dot)"></span>Interview scheduled</span><span class="tk">--stage-interview-*</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-offer-bg);color:var(--stage-offer-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-offer-dot)"></span>Offer received</span><span class="tk">--stage-offer-*</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-rejected-bg);color:var(--stage-rejected-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-rejected-dot)"></span>Rejected</span><span class="tk">--stage-rejected-*</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--stage-withdrawn-bg);color:var(--stage-withdrawn-fg);font-size:var(--caption-size);letter-spacing:var(--caption-ls)"><span style="width:6px;height:6px;border-radius:99px;background:var(--stage-withdrawn-dot)"></span>Withdrawn</span><span class="tk">--stage-withdrawn-*</span></div></div></body></html>
