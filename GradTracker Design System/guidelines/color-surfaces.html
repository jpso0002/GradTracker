<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces (light)" subtitle="Page, sunken band, card, cream interlude" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="m"><span class="n">Page</span><span class="tk">--surface-page</span></div></div><div class="sw"><div class="chip" style="background:var(--canvas-soft)"></div><div class="m"><span class="n">Sunken</span><span class="tk">--surface-sunken</span></div></div><div class="sw"><div class="chip" style="background:#fbfcfe"></div><div class="m"><span class="n">Inset</span><span class="tk">--surface-inset</span></div></div><div class="sw"><div class="chip" style="background:#f4f7fb"></div><div class="m"><span class="n">Hover</span><span class="tk">--surface-hover</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-050)"></div><div class="m"><span class="n">Selected</span><span class="tk">--surface-selected</span></div></div><div class="sw"><div class="chip" style="background:var(--canvas-cream)"></div><div class="m"><span class="n">Cream</span><span class="tk">--surface-cream</span></div></div></div></body></html>
