<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="m"><span class="n">Body / heading</span><span class="tk">--ink-900</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="m"><span class="n">Secondary</span><span class="tk">--ink-700</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="m"><span class="n">Muted</span><span class="tk">--ink-500</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-450)"></div><div class="m"><span class="n">Nav</span><span class="tk">--ink-450</span></div></div><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="m"><span class="n">On primary</span><span class="tk">--white</span></div></div></div></body></html>
