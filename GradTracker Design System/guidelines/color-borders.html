<!-- @dsCard group="Colors" viewport="700x150" name="Hairlines & borders" subtitle="1px rules, input borders, focus ring" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:16px;align-items:stretch"><div class="sw" style="width:150px"><div class="chip" style="background:var(--surface-card);border-bottom:1px solid var(--hairline)"></div><div class="m"><span class="n">Card hairline</span><span class="tk">--border-hairline</span></div></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--hairline-input)"></div><div class="m"><span class="n">Input border</span><span class="tk">--border-input</span></div></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px #cbd6e2"></div><div class="m"><span class="n">Strong</span><span class="tk">--border-strong</span></div></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--indigo-500),var(--focus-ring)"></div><div class="m"><span class="n">Focus ring</span><span class="tk">--focus-ring</span></div></div></div></body></html>
