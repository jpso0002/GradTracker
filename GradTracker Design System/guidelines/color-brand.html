<!-- @dsCard group="Colors" viewport="700x150" name="Brand indigo" subtitle="The CTA ramp — one filled indigo per band" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--indigo-050)"></div><div class="m"><span class="n">Wash</span><span class="tk">--indigo-050</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-100)"></div><div class="m"><span class="n">Subdued</span><span class="tk">--indigo-100</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-300)"></div><div class="m"><span class="n">Soft</span><span class="tk">--indigo-300</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-500)"></div><div class="m"><span class="n">Primary</span><span class="tk">--indigo-500</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="m"><span class="n">Hover</span><span class="tk">--indigo-600</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-700)"></div><div class="m"><span class="n">Press</span><span class="tk">--indigo-700</span></div></div><div class="sw"><div class="chip" style="background:var(--indigo-900)"></div><div class="m"><span class="n">Navy 900</span><span class="tk">--indigo-900</span></div></div></div></body></html>
