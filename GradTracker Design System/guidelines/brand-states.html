<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:120px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-hairline)}.sw .chip{height:52px}.sw .m{padding:6px 8px;display:flex;flex-direction:column;gap:1px}.n{font-size:11px;color:var(--text-body)}.v{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}.tk{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:var(--button-md-size);font-weight:400"><span style="display:inline-flex;padding:8px 16px;border-radius:9999px;background:var(--indigo-500);color:#fff">Default</span><span style="display:inline-flex;padding:8px 16px;border-radius:9999px;background:var(--indigo-600);color:#fff">Hover</span><span style="display:inline-flex;padding:8px 16px;border-radius:9999px;background:var(--indigo-700);color:#fff">Pressed</span><span style="display:inline-flex;padding:8px 16px;border-radius:9999px;background:var(--indigo-500);color:#fff;box-shadow:var(--focus-ring)">Focused</span><span style="display:inline-flex;padding:8px 16px;border-radius:9999px;background:var(--indigo-500);color:#fff;opacity:.45">Disabled</span></div><div class="tk" style="margin-top:14px">120ms · cubic-bezier(.2,.8,.2,1) · rows tint to --surface-hover, no lift</div></body></html>
